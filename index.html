<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Book of Nights has moved</title>
<meta http-equiv="refresh" content="0; url=https://jimbodakilla.github.io/the-nine-oclock-book/">
<link rel="canonical" href="https://jimbodakilla.github.io/the-nine-oclock-book/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1430;color:#f5e9c8;font:18px Georgia,serif;text-align:center;padding:16px}a{color:#F5C76B}</style>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(()=>{});
location.replace("https://jimbodakilla.github.io/the-nine-oclock-book/" + location.hash);
</script></head>
<body><p>The book has a new home.<br><a href="https://jimbodakilla.github.io/the-nine-oclock-book/">Open it here</a></p></body></html>
